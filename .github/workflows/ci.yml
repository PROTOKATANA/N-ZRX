# Puerta de calidad en cada push a main y en cada pull request: lo mismo que scripts/check.sh, más
# la revisión de binarios, tamaños y secretos de todos los archivos seguidos.
# Plataforma soportada: Linux x86_64.
#
# Corre en un ejecutor propio (más rápido que el gratuito de GitHub, donde la suite no cabe en 6 h):
# cada ejecución espera la aprobación manual del entorno «ejecutor-propio», y el ejecutor es efímero
# y está enjaulado (sin acceso a la carpeta personal ni a los servicios de la máquina). Las
# herramientas de la puerta (compilador fijado, shellcheck, shfmt, gitleaks, cargo-audit, pwsh con
# PSScriptAnalyzer) ya están instaladas en él.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puerta-de-calidad:
    name: Puerta de calidad (Linux x86_64)
    runs-on: [self-hosted, linux, x64, zerox]
    environment: ejecutor-propio
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Binarios, tamaños y secretos de todos los archivos seguidos
        # En una rama huérfana todo lo seguido queda como «añadido», así que el gancho pre-commit
        # revisa el árbol entero con las mismas reglas que en local.
        run: |
          git checkout --orphan revision-ci
          .githooks/pre-commit

      - name: Puerta de calidad
        run: scripts/check.sh
